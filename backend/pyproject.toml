[project]
name = "hydrosim-backend"
version = "0.1.0"
description = "HydroSim - Interactive Hydroponics & Greenhouse Simulator Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",  # Includes httptools for better HTTP parsing performance
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.0",
]
# Note: uvloop provides better event loop performance but cannot be installed on Windows
# For production on Linux/macOS, you can add: "uvloop>=0.19.0; sys_platform != 'win32'"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
# Tests are not part of the production lint gate.
ignore = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
# Disable pure style/convention noise so the gate focuses on real issues
# (unused imports, reimports, broad excepts, missing-from, etc. stay enabled).
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "bad-indentation",
    "trailing-whitespace",
    "trailing-newlines",
    "missing-final-newline",
    "too-few-public-methods",
    "duplicate-code",
    "wrong-import-order",
    "ungrouped-imports",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



