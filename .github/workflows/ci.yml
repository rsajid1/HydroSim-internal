name: HydroSim CI Pipeline

# Triggers:
#   pull_request  -> runs for PRs created from ANY branch (a branches filter would only
#                    constrain the PR's base/target branch, never the source). Each new push
#                    to an open PR re-runs CI automatically via the `synchronize` activity.
#   push          -> scoped to main so merges into the protected branch are validated directly.
#                    Feature-branch pushes don't need a separate run here — their open PR covers them.
on:
  pull_request:
  push:
    branches:
      - main

# Read-only token. Coverage is surfaced through the job summary and build
# artifacts, so nothing here needs to write back to the repo or the PR.
permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────
  # JOB 1: Frontend — Next.js + TypeScript
  # ──────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Runs the same suite as `npm test`, plus V8 coverage instrumentation.
      # A failing test still fails this step (and therefore the job); coverage
      # itself never fails the build — no thresholds are configured.
      - name: Run unit tests with coverage (Vitest)
        run: npm run test:coverage

      # `always()` so reviewers still get whatever coverage was collected on a
      # failing run. The step never changes the job's success/failure state.
      - name: Publish frontend coverage to job summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs frontend coverage/coverage-summary.json

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────
  # JOB 2: Backend — FastAPI + Python 3.11
  # ──────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    # Stub environment variables so the app can load
    # without real AWS Cognito or PostgreSQL credentials.
    env:
      DEBUG: "true"
      COGNITO_REGION: "us-east-1"
      COGNITO_USER_POOL_ID: "us-east-1_TESTPOOL"
      COGNITO_CLIENT_ID: "test-client-id"
      COGNITO_CLIENT_SECRET: "test-client-secret"
      DB_HOST: "localhost"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "hydrosim_test"
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies
        run: uv pip install -r requirements.txt --system

      - name: Install test and lint tools
        run: uv pip install pytest pytest-asyncio pytest-cov httpx pylint --system

      - name: Run Pylint
        run: pylint app/ config/ --fail-under=7.0

      # `--cov` with no argument uses [tool.coverage.run] source from pyproject.toml.
      # term-missing prints the table in the log; json feeds the job summary;
      # xml/html are uploaded as artifacts. No --cov-fail-under: coverage never
      # fails the build, but a failing test still does.
      - name: Run pytest with coverage
        run: >-
          pytest --tb=short -q
          --cov
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Publish backend coverage to job summary
        if: always()
        working-directory: .
        run: node scripts/ci/coverage-summary.mjs backend backend/coverage.json

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/htmlcov/
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify app loads correctly
        run: python -c "from app.index import app; print('FastAPI app loaded successfully')"
